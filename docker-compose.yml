name: bystend

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: bystend-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/dev.db
      CSV_DATA_DIR: /app/data/csvs
      API_PORT: 4000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SEED_ON_START: ${SEED_ON_START:-false}
    volumes:
      - bystend-db:/app/data
      - ${CSV_HOST_PATH:-./data}:/app/data/csvs:ro

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: bystend-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  bystend-db:
